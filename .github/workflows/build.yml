name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Build x64
        shell: powershell
        run: ./scripts/build.ps1
      - name: Run hardware-independent tests
        shell: powershell
        run: ./scripts/test.ps1
      - name: Check native installation and trackpad policies without configuring devices
        shell: pwsh
        run: |
          foreach ($check in @('--test-trackpad-installer','--test-installer','--test-shell-integration','--test-installer-ui','--test-package-setup')) {
            $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList $check -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) { throw "Native installation check failed: $check" }
          }
      - name: Check native mouse registry operations
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-native-mouse' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Native mouse registry check failed' }
      - name: Check Boot Camp device matching
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-driver-info' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Boot Camp device matching failed' }
      - name: Check WSL setup states without installing Linux
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-wsl' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'WSL setup state check failed' }
      - name: Check actionable Windows errors
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-errors' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Windows error readability check failed' }
      - name: Check native input-profile API without changing profiles
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-apple-layouts' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Native input-profile check failed' }
      - name: Check native sleep permission without changing power state
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-power' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Native sleep permission check failed' }
      - name: Check DDC opt-in and legacy migration
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-brightness-policy' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Brightness policy check failed' }
      - name: Check bounded asynchronous display requests
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-display-queue' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Display request queue check failed' }
      - name: Check Mac preset migration and saved edits
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-keyboard-config' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Mac preset migration check failed' }
      - name: Check native foreground executable lookup without sending input
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-foreground' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Foreground executable lookup check failed' }
      - name: Check bounded indicator and HID delivery
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-indicator-mailboxes' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Indicator mailbox check failed' }
      - name: Check native driver-file verification primitives
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-driver-trust' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Native driver-file verification check failed' }
      - name: Check native ABI
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--abi-check' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'ABI check failed' }
      - name: Check native storage
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-storage' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Storage check failed' }
      - name: Check sent-message worker waits
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-worker-wait' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Worker wait check failed' }
      # Native settings check creates only this app's own controls; no display or input hook.
      - name: Check cursor composition policy without changing the display
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-cursor-policy' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Cursor composition policy check failed' }
      - name: Check native settings layout
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/SwiftyToys.exe -ArgumentList '--test-ui' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw 'Native settings check failed' }
      - name: Build and validate native Swift setup package
        shell: powershell
        run: |
          ./scripts/package.ps1
          ./scripts/build-setup.ps1 -PackageDirectory ./artifacts/SwiftyToys-0.1.12-win-x64
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwiftyToys-win-x64
          path: |
            artifacts/SwiftyToys.exe
            artifacts/*.dll
            artifacts/runtime-files.txt
            artifacts/*-Setup.exe
            artifacts/*-Setup.exe.sha256
            artifacts/resources/
            artifacts/Languages/
            Licenses/
            LICENSE
            THIRD_PARTY_NOTICES.md
  macos-core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - run: swift test
